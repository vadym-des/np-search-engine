name: Sync Nova Poshta Data

on:
  schedule:
    # Запуск щоночі о 03:00 UTC (05:00/06:00 за київським часом)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Nova Poshta warehouses (full 55k+ database with safety guard)
        env:
          NP_API_KEY: ${{ secrets.NP_API_KEY }}
        run: |
          node scripts/sync_nova_poshta.js

      - name: Build compact branches.fast.js bundle
        run: |
          node scripts/build_branches_fast.js

      - name: Run complete test suite (18-Module Safety & Anti-Regression Gate)
        run: |
          node tests/run_all.js

      - name: Commit and push updated database to main and gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/branches.js data/branches.fast.js
          if git diff --staged --quiet; then
            echo "Змін у даних відділень немає. Пропуск коміту."
          else
            git commit -m "chore(data): Auto-sync Nova Poshta warehouses from API [skip ci]"
            git push origin main
            git push origin main:gh-pages --force
          fi
